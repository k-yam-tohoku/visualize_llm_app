[project]
name = "visualize-llm-app"
version = "0.1.0"
description = "FastAPI + React application for visualizing LLM internal operations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Fukata-K", email = "fukata@example.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch==2.7.1",
    "transformer-lens==2.16.1",
    "datasets==2.18.0",
    "pyarrow==14.0.2",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Fukata-K/visualize_llm_app"
Repository = "https://github.com/Fukata-K/visualize_llm_app"
Issues = "https://github.com/Fukata-K/visualize_llm_app/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
pythonpath = ["."]

# Application (not a distributable library): uv manages dependencies but does
# not build/install this project itself into the environment.
[tool.uv]
package = false
